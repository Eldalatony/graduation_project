services:
  # === INFRASTRUCTURE & DATABASES ===
  # Note: MQTT broker is now hosted on HiveMQ Cloud (see backend/.env MQTT_BROKER_URL).
  # No local Mosquitto container is required.

  postgres:
    image: postgres:15
    container_name: shemms_postgres
    environment:
      POSTGRES_DB: shemms
      POSTGRES_USER: shemms_user
      POSTGRES_PASSWORD: shemms_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shemms_user -d shemms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: shemms_influxdb
    ports:
      - "8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: shemms_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # === DATABASE ADMIN UIs (browser interfaces) ===
  # pgAdmin -> http://localhost:5050   (PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: shemms_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  # mongo-express -> http://localhost:8081   (MongoDB)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: shemms_mongo_express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    restart: unless-stopped

  # === CUSTOM MICROSERVICES ===
  backend:
    build: ./backend
    container_name: shemms_backend
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
      mongodb:
        condition: service_started
    env_file:
      - ./backend/.env
    restart: unless-stopped

  analytics:
    build: ./analytics
    container_name: shemms_analytics
    # Exposed on the host for direct debugging; the canonical client path is
    # via the backend proxy at /api/analytics/* and /api/ui/* on port 3001.
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_started
    env_file:
      - ./analytics/.env
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: shemms_simulator
    depends_on:
      - backend
    env_file:
      - ./simulator/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: shemms_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    restart: unless-stopped

volumes:
  pg_data:
  influx_data:
  mongo_data:
  pgadmin_data: